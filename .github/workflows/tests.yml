# Name the Workflow
name: Tests

# Set the Triggers
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

# Set Permissions
permissions:
    contents: read

# Define Jobs
jobs:
    coverage:
        name: Tests with Coverage
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: 24
            cache: npm
        - run: npm ci
        - run: npm run test:coverage
        - uses: actions/upload-artifact@v7
          with:
            name: test-coverage-report
            path: coverage/
